[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realmguard"
version = "0.1.0"
description = "Realmguard — a Kingdom Rush-inspired modular tower defense built on Python Arcade."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kyle Lui" }]
license = { text = "MIT" }
dependencies = [
    "arcade>=3.0.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
realmguard = "td_game.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
